<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit converter</title>

  <style>
    * {{
      box-sizing: border-box;
    }}

    body {{
      margin: 0;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }}

    .container {{
      width: min(100%, 520px);
      margin: 0 auto;
      padding: 30px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
    }}

    h1 {{
      margin-top: 0;
      margin-bottom: 24px;
      text-align: center;
    }}

    .category-buttons {{
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }}

    .category-buttons button {{
      flex: 1;
    }}

    form {{
      margin: 0;
    }}

    label {{
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }}

    input,
    select,
    button {{
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      font: inherit;
      border: 1px solid #bbb;
      border-radius: 6px;
    }}

    input:focus,
    select:focus {{
      outline: 2px solid #b8d4ff;
      border-color: #6b9de8;
    }}

    .field {{
      margin-bottom: 18px;
    }}

    .convert-button {{
      margin-top: 4px;
      cursor: pointer;
      font-weight: bold;
    }}

    .error {{
      margin: 8px 0 16px;
      color: #c62828;
    }}

    button {{
      cursor: pointer;
      background: #f7f7f7;
    }}

    button:hover {{
      background: #eaeaea;
    }}
  </style>
</head>

<body>
  <main class="container">
    <h1>Unit Converter</h1>

    <form method="get" class="category-buttons">
      <button type="submit" name="unit" value="length">Length</button>
      <button type="submit" name="unit" value="weight">Weight</button>
      <button type="submit" name="unit" value="temperature">Temperature</button>
    </form>

    <form method="post" action="/result">
      <div class="field">
        <label for="input_data">Enter the {unit} to convert</label>
        <input
          id="input_data"
          type="number"
          step="any"
          name="input_data"
          required
        >
      </div>

      {error_msg}

      <div class="field">
        <label for="units_from">Unit to convert from</label>
        <select id="units_from" name="units_from">
          {options_from}
        </select>
      </div>

      <div class="field">
        <label for="units_to">Unit to convert to</label>
        <select id="units_to" name="units_to">
          {options_to}
        </select>
      </div>

      <button class="convert-button" type="submit">Convert</button>
    </form>
  </main>
</body>
</html>
